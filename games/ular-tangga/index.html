<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title data-i18n="title.ut">Ular Tangga Museum Affandi</title>

    <link rel="stylesheet" href="../../shared/main.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="page-ular">

    <div class="screen ut-screen">

      <!-- TOP BAR -->
      <div class="topbar">
        <button class="btn ghost" onclick="goHome()" data-i18n="common.backMenu">← Menu Utama</button>
        <div class="ut-hud" id="ut-hud"></div>
      </div>

      <!-- TITLE -->
      <h2 class="ut-title" data-i18n="ut.title">Ular Tangga Museum Affandi</h2>

      <!-- GAME LAYOUT -->
      <div class="ut-layout">

        <!-- BOARD -->
        <div class="ut-board-wrap">
          <div class="ut-board" id="ut-board"></div>
        </div>

        <!-- SIDE PANEL -->
        <div class="ut-side">

          <!-- PLAYERS -->
          <div class="players" id="players"></div>

          <!-- DICE -->
          <div class="dice-area">
            <div class="dice" id="dice">
              <div class="dice-face" id="dice-face" data-i18n-aria="ut.dice" aria-label="Dadu"></div>
            </div>

            <button class="btn" id="roll-btn" onclick="rollDice()" data-i18n="ut.roll">Lempar Dadu</button>

            <p class="turn-text" id="turn-text" data-i18n="ut.turnDefault">Giliran Pemain 1</p>
          </div>

        </div>

      </div>

    </div>

    <!-- WIN OVERLAY -->
    <div class="overlay" id="overlay-win">
      <div class="overlay-card">
        <h2 id="win-title" data-i18n="ut.winTitleDefault">Pemain Menang!</h2>
        <p id="win-text"></p>
        <div class="row">
          <button class="btn secondary" onclick="resetGame()" data-i18n="ut.playAgain">Main Lagi</button>
          <button class="btn" onclick="goHome()" data-i18n="common.mainMenu">Menu Utama</button>
        </div>
      </div>
    </div>

    <!-- START OVERLAY -->
    <div class="overlay show" id="overlay-start">
      <div class="overlay-card">
        <h2 data-i18n="ut.startTitle">Ular Tangga Museum</h2>
        <p data-i18n="ut.startText">Pilih jumlah pemain untuk mulai bermain.</p>
        <div class="row">
          <button class="btn secondary" onclick="startGame(2)" data-i18n="ut.players2">2 Pemain</button>
          <button class="btn secondary" onclick="startGame(3)" data-i18n="ut.players3">3 Pemain</button>
          <button class="btn" onclick="startGame(4)" data-i18n="ut.players4">4 Pemain</button>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../../shared/i18n.js"></script>
    <script src="../../shared/main.js"></script>
    <script src="board-data.js"></script>
    <script src="script.js"></script>

  </body>
</html>
